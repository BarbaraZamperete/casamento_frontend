<div class="carrossel-wrapper">

  <button
    type="button"
    class="scroll-btn scroll-btn-left"
    aria-label="Rolar para a esquerda"
    (click)="scroll(-1)">
    <i class="bi bi-chevron-left"></i>
  </button>

  <div #scrollContainer class="familia-scroll">

    @for(card of cards; track card.titulo){

      <div class="polaroid">

        <div class="tape"></div>

        <img
          [src]="card.imagem"
          [alt]="card.titulo" loading="lazy" decoding="async">

        <div class="polaroid-body">

          <h3>{{ card.titulo }}</h3>

          <div class="descricao">
            <ul>
              @for (descricao of card.descricao; track $index) {
                <li>{{ descricao }}</li>
              }
            </ul>
          </div>

        </div>

      </div>

    }

  </div>

  <button
    type="button"
    class="scroll-btn scroll-btn-right"
    aria-label="Rolar para a direita"
    (click)="scroll(1)">
    <i class="bi bi-chevron-right"></i>
  </button>

</div>
