<div class="carrossel-wrapper">

  <button
    class="scroll-btn scroll-btn-left"
    (click)="scroll(-1)">
    <i class="bi bi-chevron-left"></i>
  </button>

  <div #scrollContainer class="familia-scroll">

    @for(card of cards; track $index){

      <div class="polaroid">

        <div class="tape"></div>

        <img
          [src]="card.imagem && card.imagem.trim() !== '' ? card.imagem : 'assets/images/default-image.webp'"
          [alt]="card.titulo" loading="lazy" decoding="async">

        <div class="polaroid-body">

          <h3>{{ card.titulo }}</h3>

          <div
            class="descricao"
            [innerHTML]="card.descricao">
          </div>

        </div>

      </div>

    }

  </div>

  <button
    class="scroll-btn scroll-btn-right"
    (click)="scroll(1)">
    <i class="bi bi-chevron-right"></i>
  </button>

</div>
