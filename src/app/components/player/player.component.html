<div class="player">

  <audio #audio (ended)="next()"></audio>

  <div class="title">
    <i class="bi bi-music-note"></i> {{ tracks[currentIndex].title }}
  </div>

  <div class="controls">

    <button (click)="prev()"><i class="bi bi-chevron-bar-left"></i></button>

    <button class="play-btn" (click)="onPlayPause()">
      @if(isPlaying){
      <i class="bi bi-pause-fill"></i>
      } @else {
      <i class="bi bi-play-fill"></i>
      }
    </button>

    <button (click)="next()"><i class="bi bi-chevron-bar-right"></i></button>

  </div>

</div>
