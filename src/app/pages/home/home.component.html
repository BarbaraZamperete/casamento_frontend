<!-- Seção Hero -->
<section class="hero d-flex">
  <!-- <img src="assets/images/monograma.png" alt="Monograma Bárbara & Kamila" class="monograma"> -->
  <div class="container text-center titulo-container">
    <h1 class="titulo-principal">
      <span class="nome">Bárbara</span>
      <span class="e"> & </span>
      <span class="nome">Kamila</span>
    </h1>
    <p class="subtitulo uppercase">27 | Março | 2027</p>
    <p class="mensagem">Conheça um pouco da nossa jornada!</p>
    <!-- <a href="#confirmacao" class="btn btn-outline-dark btn-lg">Confirmar Presença</a> -->
  </div>
</section>

<!-- NavBar -->
<app-simple-nav-bar></app-simple-nav-bar>

<!-- Contagem regressiva -->
<section class="countdown-section py-5">
  <div class="container text-center">

    <img src="assets/images/monograma.png" alt="Monograma Bárbara & Kamila" class="monograma">

    <p class="countdown-subtitle mb-4">
      Estamos contando os dias para viver esse momento com vocês
    </p>

    <div class="countdown-display d-flex justify-content-center align-items-center">

      <div class="time-unit">
        <span class="number">{{ days }}</span>
        <span class="label">Dias</span>
      </div>

      <span class="separator">:</span>

      <div class="time-unit">
        <span class="number">{{ hours }}</span>
        <span class="label">Horas</span>
      </div>

      <span class="separator">:</span>

      <div class="time-unit">
        <span class="number">{{ minutes }}</span>
        <span class="label">Min</span>
      </div>

      <span class="separator">:</span>

      <div class="time-unit">
        <span class="number">{{ seconds }}</span>
        <span class="label">Seg</span>
      </div>

    </div>

  </div>
</section>


<!-- Nossa História -->
<section id="historia" class="py-5 cor">
  <div class="container">
    <h2 class="titulo-sessao">Nossa História</h2>
    <app-timeline></app-timeline>
  </div>
</section>
